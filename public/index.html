<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keplar World - WhatsApp Bot Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0ea5e9; }
        .section { display: none; }
        .active { display: block; }
        #qr-container { text-align: center; margin-top: 20px; }
        #qr-container img { max-width: 250px; background: #fff; padding: 10px; border-radius: 8px; }
        .msg { text-align: center; margin-top: 10px; font-size: 14px; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <h2>Keplar World Bot Panel</h2>

    <div id="auth-section" class="active">
        <h3>Login / Register</h3>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button onclick="registerUser()">Register</button>
        <button onclick="loginUser()" style="background: #16a34a;">Login</button>
        <p id="auth-msg" class="msg"></p>
    </div>

    <div id="dashboard-section" class="section">
        <h3>Welcome, <span id="user-display"></span></h3>
        <div class="form-group">
            <label>Connection Method</label>
            <select id="bot-choice">
                <option value="1">QR Code Scan</option>
                <option value="2">Pairing Code</option>
            </select>
        </div>
        <div class="form-group" id="phone-group" style="display:none;">
            <label>WhatsApp Phone Number (with Country Code)</label>
            <input type="text" id="phone-number" placeholder="e.g. 916291588399">
        </div>
        <button onclick="startBot()">Start WhatsApp Bot</button>
        <button onclick="stopBot()" style="background: #dc2626;">Stop Bot</button>
        
        <div id="qr-container"></div>
        <p id="bot-status" class="msg">Bot is Offline</p>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentUserId = '';

    document.getElementById('bot-choice').addEventListener('change', (e) => {
        document.getElementById('phone-group').style.display = e.target.value === '2' ? 'block' : 'none';
    });

    function registerUser() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        socket.emit('register_user', { username, password });
    }

    function loginUser() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        socket.emit('login_user', { username, password });
    }

    socket.on('auth_error', (err) => { document.getElementById('auth-msg').innerText = err; });
    socket.on('register_success', (msg) => { document.getElementById('auth-msg').innerText = msg; });
    
    socket.on('login_success', (username) => {
        currentUserId = username;
        document.getElementById('auth-section').classList.remove('active');
        document.getElementById('dashboard-section').classList.add('active');
        document.getElementById('user-display').innerText = username;
    });

    function startBot() {
        const choice = document.getElementById('bot-choice').value;
        const phone = document.getElementById('phone-number').value;
        document.getElementById('bot-status').innerText = 'Starting bot, please wait...';
        socket.emit('start_bot', { choice, phone, userId: currentUserId });
    }

    function stopBot() {
        socket.emit('stop_bot', currentUserId);
    }

    socket.on('qr_code', (url) => {
        document.getElementById('qr-container').innerHTML = `<img src="${url}" alt="QR Code"><p>Scan this QR Code with WhatsApp</p>`;
    });

    socket.on('pairing_code', (code) => {
        document.getElementById('qr-container').innerHTML = `<h3>Your Pairing Code: <span style="color:#38bdf8">${code}</span></h3>`;
    });

    socket.on('bot_ready', () => {
        document.getElementById('bot-status').innerText = '✅ Bot is Connected and Online!';
        document.getElementById('qr-container').innerHTML = '';
    });

    socket.on('bot_stopped', () => {
        document.getElementById('bot-status').innerText = '🛑 Bot is Stopped.';
        document.getElementById('qr-container').innerHTML = '';
    });
</script>
</body>
</html>
